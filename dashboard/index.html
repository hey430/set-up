<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--PAGE-START-->
<title>Brand Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: brand rail on the left, one scrolling brand room on the right; ad specs open in a side sheet. */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --surface-2: #f6f8fb;
  --ink: #131a2b;
  --muted: #5a6479;
  --faint: #8a93a6;
  --line: #dfe4ec;
  --accent: #d92a5e;        /* GMV, selection */
  --accent-soft: #fbe3eb;
  --accent-2: #0b93a6;      /* ad spend */
  --good: #14804a;
  --good-soft: #dcf3e6;
  --warn: #a35d00;
  --warn-soft: #fbecd2;
  --bad: #c0322b;
  --bad-soft: #fbe0de;
  --info: #3653c9;
  --info-soft: #e1e7fb;
  --shadow: 0 1px 2px rgba(19, 26, 43, .05), 0 6px 20px rgba(19, 26, 43, .06);

  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --r: 10px;
  --rail: 288px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d111c; --surface: #151b2a; --surface-2: #1b2234; --ink: #e8ebf3; --muted: #a2abbf; --faint: #737d93;
    --line: #273047; --accent: #ff5c8a; --accent-soft: #3a1a29; --accent-2: #2cc4d6;
    --good: #4fd18b; --good-soft: #143224; --warn: #f0b04a; --warn-soft: #36290f; --bad: #ff7a72; --bad-soft: #3b1a1a;
    --info: #8ea3ff; --info-soft: #1d2547; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d111c; --surface: #151b2a; --surface-2: #1b2234; --ink: #e8ebf3; --muted: #a2abbf; --faint: #737d93;
  --line: #273047; --accent: #ff5c8a; --accent-soft: #3a1a29; --accent-2: #2cc4d6;
  --good: #4fd18b; --good-soft: #143224; --warn: #f0b04a; --warn-soft: #36290f; --bad: #ff7a72; --bad-soft: #3b1a1a;
  --info: #8ea3ff; --info-soft: #1d2547; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 14px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }

/* ---------- top bar ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-mark {
  width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
  background: var(--ink); color: var(--surface); font: 700 15px/1 var(--font-display);
}
.logo-name { font: 700 17px/1 var(--font-display); }
.logo-agency { color: var(--muted); font-size: 13px; }
.sync { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.source {
  display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px;
  border: 1px solid var(--line); border-radius: 999px; font-size: 12px; color: var(--muted); background: var(--surface-2);
}
.source b { color: var(--ink); font-weight: 600; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); flex: none; }
.sample {
  font: 500 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .06em;
  padding: 6px 9px; border-radius: 6px; background: var(--warn-soft); color: var(--warn);
}

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); align-items: start; }

.rail {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 55px);
  height: calc(100vh - 55px - env(safe-area-inset-top, 0px));
  overflow-y: auto; border-right: 1px solid var(--line); background: var(--surface);
  padding-block: 16px;
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: 14px;
  display: flex; flex-direction: column; gap: 12px;
}
.rail-head { display: flex; justify-content: space-between; align-items: baseline; padding-inline: 4px; }
.search {
  width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--ink); font: inherit;
}
.search::placeholder { color: var(--faint); }
.brand-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.brand-btn {
  width: 100%; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; align-items: center;
  padding: 9px 8px; border: 0; border-radius: 9px; background: transparent; text-align: left; cursor: pointer;
}
.brand-btn:hover { background: var(--surface-2); }
.brand-btn[aria-current="true"] { background: var(--accent-soft); }
.brand-btn[aria-current="true"] .brand-btn-name { color: var(--accent); }
.mono {
  width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center;
  font: 700 14px/1 var(--font-display); color: #fff;
}
.brand-btn-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-btn-meta { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-btn-side { text-align: right; font-size: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.brand-btn-side .num { font-weight: 600; }
.sdot { width: 8px; height: 8px; border-radius: 50%; }
.s-on-track { background: var(--good); }
.s-attention { background: var(--warn); }
.s-at-risk { background: var(--bad); }
.rail-empty { color: var(--muted); padding: 8px; font-size: 13px; }

/* ---------- main ---------- */
main {
  min-width: 0;
  padding-block: 24px 48px;
  padding-left: max(16px, 28px);
  padding-right: max(16px, env(safe-area-inset-right, 0px), 28px);
  display: flex; flex-direction: column; gap: 20px;
}
.brand-head { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.brand-head .mono { width: 60px; height: 60px; border-radius: 14px; font-size: 24px; }
.brand-title { min-width: 0; flex: 1 1 260px; display: flex; flex-direction: column; gap: 4px; }
.brand-title h1 { font-size: clamp(24px, 3vw, 32px); font-weight: 700; line-height: 1.1; }
.brand-sub { color: var(--muted); display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 13px; }
.status {
  display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px;
  font-weight: 600; font-size: 13px;
}
.status small { font-weight: 400; opacity: .85; }
.st-on-track { background: var(--good-soft); color: var(--good); }
.st-attention { background: var(--warn-soft); color: var(--warn); }
.st-at-risk { background: var(--bad-soft); color: var(--bad); }
.goal {
  display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
  padding: 10px 14px; border-radius: var(--r); background: var(--surface); border: 1px dashed var(--line);
}
.goal span:last-child { font-weight: 500; }

.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.kpi {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0;
}
.kpi-val { font: 700 24px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.delta { font-size: 12px; font-weight: 600; display: inline-flex; gap: 4px; align-items: center; }
.delta.up { color: var(--good); }
.delta.down { color: var(--bad); }
.delta.flat { color: var(--muted); }
.delta span { color: var(--faint); font-weight: 400; }

.row { display: grid; gap: 20px; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); align-items: start; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 18px; min-width: 0; display: flex; flex-direction: column; gap: 14px;
}
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.card-head h2 { font-size: 17px; font-weight: 700; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--faint); font: 400 11px var(--font-mono); }

/* slack */
.feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.msg { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; }
.avatar {
  width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center;
  background: var(--surface-2); border: 1px solid var(--line); font: 600 11px/1 var(--font-body); color: var(--muted);
}
.msg-top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 13px; }
.msg-top b { font-weight: 600; }
.msg-top time { color: var(--faint); font-size: 12px; }
.msg p { margin: 2px 0 0; color: var(--ink); }
.channel { font: 500 12px var(--font-mono); color: var(--info); }

/* ads */
.ads-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.ads-head h2 { font-size: 20px; font-weight: 700; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px;
  font-size: 13px; cursor: pointer; color: var(--muted);
}
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip .num { opacity: .7; margin-left: 4px; }
.ads { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.ad {
  border: 1px solid var(--line); background: var(--surface); border-radius: 12px; overflow: hidden;
  padding: 0; text-align: left; cursor: pointer; display: flex; flex-direction: column;
  transition: transform .15s ease, box-shadow .15s ease;
}
.ad:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.thumb {
  position: relative; aspect-ratio: 4 / 5; max-width: 100%; overflow: hidden;
  display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; color: #fff;
}
.thumb::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0) 55%);
}
.thumb > * { position: relative; z-index: 1; }
.thumb-hook { font: 600 15px/1.25 var(--font-display); text-wrap: balance; text-shadow: 0 1px 8px rgba(0,0,0,.35); }
.thumb-top { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 1; }
.tag {
  font: 500 11px/1 var(--font-mono); padding: 5px 7px; border-radius: 5px;
  background: rgba(0,0,0,.45); color: #fff; backdrop-filter: blur(4px);
}
.play {
  position: absolute; top: 50%; left: 50%; translate: -50% -60%; z-index: 1;
  width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.22); backdrop-filter: blur(6px);
  display: grid; place-items: center;
}
.play::before { content: ""; border-left: 14px solid #fff; border-top: 9px solid transparent; border-bottom: 9px solid transparent; margin-left: 4px; }
.pill { font: 600 11px/1 var(--font-body); padding: 5px 8px; border-radius: 999px; letter-spacing: .02em; }
.p-live { background: var(--good-soft); color: var(--good); }
.p-paused { background: var(--warn-soft); color: var(--warn); }
.p-ended { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.p-review { background: var(--info-soft); color: var(--info); }
.ad-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.ad-title { font-weight: 600; line-height: 1.3; }
.ad-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.ad-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; margin-top: auto; }
.ad-stats div { display: flex; flex-direction: column; gap: 2px; }
.ad-stats b { font: 600 14px var(--font-body); font-variant-numeric: tabular-nums; }
.ad-stats span { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; }
.ads-empty { color: var(--muted); padding: 24px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }

/* products + account */
.products { display: flex; flex-direction: column; gap: 12px; }
.prod { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; }
.prod-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prod-val { text-align: right; font-weight: 600; }
.bar { grid-column: 1 / -1; height: 6px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.prod-sub { grid-column: 1 / -1; font-size: 12px; color: var(--faint); }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 16px; margin: 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-weight: 500; text-align: right; }
.meter { height: 8px; background: var(--surface-2); border-radius: 5px; overflow: hidden; border: 1px solid var(--line); }
.meter i { display: block; height: 100%; background: var(--accent-2); }

/* ---------- ad drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(8, 12, 22, .45); z-index: 40; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 50; width: min(520px, 100%);
  background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow);
  overflow-y: auto;
  padding-top: calc(env(safe-area-inset-top, 0px) + 20px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  padding-left: 24px;
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px;
  animation: slide .2s ease-out;
}
@keyframes slide { from { transform: translateX(24px); opacity: .6; } }
@media (prefers-reduced-motion: reduce) { .drawer { animation: none; } .ad { transition: none; } }
.drawer-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.drawer-head h2 { font-size: 22px; font-weight: 700; line-height: 1.2; }
.close {
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; width: 34px; height: 34px;
  cursor: pointer; font-size: 18px; line-height: 1; flex: none;
}
.preview-wrap { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 18px; align-items: start; }
.preview { aspect-ratio: 9 / 16; max-width: 100%; border-radius: 14px; overflow: hidden; }
.preview .thumb { aspect-ratio: auto; height: 100%; }
.preview .thumb-hook { font-size: 13px; }
.headline-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hs { background: var(--surface-2); border-radius: 9px; padding: 10px 12px; }
.hs b { display: block; font: 700 20px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.hs span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.spec-group { display: flex; flex-direction: column; gap: 8px; }
.spec-group h3 { font: 600 11px var(--font-body); text-transform: uppercase; letter-spacing: .08em; color: var(--faint); }
.specs { margin: 0; display: grid; grid-template-columns: 140px minmax(0, 1fr); border-top: 1px solid var(--line); }
.specs dt, .specs dd { padding: 9px 0; border-bottom: 1px solid var(--line); margin: 0; }
.specs dt { color: var(--muted); }
.specs dd { font-family: var(--font-mono); font-size: 13px; overflow-wrap: anywhere; }
.specs dd.text { font-family: var(--font-body); font-size: 14px; }
.drawer-foot { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 9px 14px;
  font-weight: 600; cursor: pointer;
}
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn:disabled { cursor: not-allowed; opacity: .55; }
.foot-note { font-size: 12px; color: var(--faint); }

/* ---------- responsive ---------- */
@media (max-width: 1240px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 1020px) {
  .row { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail {
    position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .brand-list { flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
  .brand-list li { flex: 0 0 220px; }
  main {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .sync { margin-left: 0; width: 100%; }
}
@media (max-width: 520px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ads { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .ad-stats { grid-template-columns: 1fr 1fr; }
  .ad-stats div:nth-child(3) { display: none; }
  .preview-wrap { grid-template-columns: 110px minmax(0, 1fr); }
  .specs { grid-template-columns: 110px minmax(0, 1fr); }
  .drawer { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
</style>
<!--HEAD-END-->
</head>
<body>
<!--BODY-START-->
<header class="topbar">
  <div class="logo">
    <div class="logo-mark" aria-hidden="true">B</div>
    <div>
      <div class="logo-name">Brand Room</div>
    </div>
    <div class="logo-agency" id="agency"></div>
  </div>
  <div class="sync" aria-label="Connected sources">
    <span class="source"><span class="dot"></span><b>Euka</b> <span id="sync-euka"></span></span>
    <span class="source"><span class="dot"></span><b>Slack</b> <span id="sync-slack"></span></span>
    <span class="sample" title="All brands, ads and numbers are placeholders until real data is connected">Sample data</span>
  </div>
</header>

<div class="app">
  <aside class="rail" aria-label="Brands">
    <div class="rail-head">
      <span class="eyebrow">Brands</span>
      <span class="eyebrow" id="brand-count"></span>
    </div>
    <input class="search" id="brand-search" type="search" placeholder="Search brands" aria-label="Search brands" autocomplete="off">
    <ul class="brand-list" id="brand-list"></ul>
  </aside>
  <main id="main" aria-live="polite"></main>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden></aside>

<script src="data.js"></script>
<script>
(function () {
  const DATA = window.DASHBOARD_DATA;
  const brands = DATA.brands;
  const $ = (s, el = document) => el.querySelector(s);

  const state = { brandId: null, filter: "all", query: "" };

  /* ---------- formatting ---------- */
  const money = (n) => {
    if (n >= 1e6) return "$" + (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, "") + "M";
    if (n >= 1e4) return "$" + Math.round(n / 1e3) + "K";
    if (n >= 1e3) return "$" + (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
    return "$" + Math.round(n).toLocaleString("en-US");
  };
  const moneyFull = (n) => "$" + Math.round(n).toLocaleString("en-US");
  const count = (n) => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M" : n >= 1e3 ? Math.round(n / 1e3) + "K" : String(n);
  const date = (s) => new Date(s + (s.length === 10 ? "T00:00:00" : "")).toLocaleDateString("en-US", { month: "short", day: "numeric" });
  const time = (s) => {
    const d = new Date(s);
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric" }) + ", " + d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const initials = (name) => name.split(/\s+/).filter((w) => /[A-Za-z]/.test(w[0])).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
  const hueOf = (str) => { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
  const monoStyle = (b) => { const h = hueOf(b.name); return `background:linear-gradient(135deg,hsl(${h} 62% 46%),hsl(${(h + 40) % 360} 58% 38%))`; };
  const thumbStyle = (ad) => `background:linear-gradient(160deg,hsl(${ad.hue} 70% 58%),hsl(${(ad.hue + 50) % 360} 60% 32%))`;

  const STATUS = { "on-track": "On track", attention: "Needs attention", "at-risk": "At risk" };
  const AD_STATUS = { live: "Live", paused: "Paused", ended: "Ended", review: "In review" };

  /* ---------- header ---------- */
  $("#agency").textContent = "· " + DATA.agency;
  $("#sync-euka").textContent = "synced " + time(DATA.lastSync.euka);
  $("#sync-slack").textContent = "synced " + time(DATA.lastSync.slack);

  /* ---------- brand rail ---------- */
  function renderRail() {
    const q = state.query.trim().toLowerCase();
    const list = brands.filter((b) => !q || (b.name + " " + b.category + " " + b.lead).toLowerCase().includes(q));
    $("#brand-count").textContent = list.length + " of " + brands.length;
    $("#brand-list").innerHTML = list.length
      ? list.map((b) => `
        <li><button class="brand-btn" data-brand="${b.id}" aria-current="${b.id === state.brandId}">
          <span class="mono" style="${monoStyle(b)}" aria-hidden="true">${esc(initials(b.name))}</span>
          <span style="min-width:0">
            <span class="brand-btn-name" style="display:block">${esc(b.name)}</span>
            <span class="brand-btn-meta" style="display:block">${esc(b.category)}</span>
          </span>
          <span class="brand-btn-side">
            <span class="num">${money(b.kpis.gmv)}</span>
            <span class="sdot s-${b.status}" title="${STATUS[b.status]}"></span>
          </span>
        </button></li>`).join("")
      : `<li class="rail-empty">No brand matches “${esc(state.query)}”.</li>`;
  }

  /* ---------- KPIs ---------- */
  function delta(cur, prev, { invert = false, neutral = false } = {}) {
    if (!prev) return `<span class="delta flat">–</span>`;
    const pct = ((cur - prev) / prev) * 100;
    const dir = Math.abs(pct) < 0.5 ? "flat" : pct > 0 ? "up" : "down";
    let tone = dir;
    if (neutral) tone = "flat";
    else if (invert && dir !== "flat") tone = dir === "up" ? "down" : "up";
    const arrow = dir === "up" ? "▲" : dir === "down" ? "▼" : "•";
    return `<span class="delta ${tone}">${arrow} ${Math.abs(pct).toFixed(1)}% <span>vs prior 30d</span></span>`;
  }
  function kpiTiles(k) {
    const tiles = [
      ["GMV · 30 days", money(k.gmv), delta(k.gmv, k.gmvPrev)],
      ["Ad spend", money(k.spend), delta(k.spend, k.spendPrev, { neutral: true })],
      ["ROAS", k.roas.toFixed(2) + "×", delta(k.roas, k.roasPrev)],
      ["Click-through rate", k.ctr.toFixed(2) + "%", delta(k.ctr, k.ctrPrev)],
      ["Active creators", k.creators, delta(k.creators, k.creatorsPrev)],
      ["Videos posted", k.videos, delta(k.videos, k.videosPrev)],
    ];
    return `<section class="kpis" aria-label="Key numbers">${tiles.map(([l, v, d]) => `
      <div class="kpi"><span class="eyebrow">${l}</span><span class="kpi-val">${v}</span>${d}</div>`).join("")}</section>`;
  }

  /* ---------- chart ---------- */
  function niceMax(v) {
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    const n = v / p;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
  }
  function chart(series) {
    const W = 680, H = 230, L = 48, R = 12, T = 12, B = 26;
    const max = niceMax(Math.max(...series.map((d) => Math.max(d.gmv, d.spend))));
    const x = (i) => L + (i * (W - L - R)) / (series.length - 1);
    const y = (v) => T + (1 - v / max) * (H - T - B);
    const line = (key) => series.map((d, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(d[key]).toFixed(1)}`).join("");
    const area = (key) => line(key) + `L${x(series.length - 1)},${y(0)}L${x(0)},${y(0)}Z`;
    const ticks = [0, 0.25, 0.5, 0.75, 1].map((f) => f * max);
    const xt = [0, 7, 14, 21, 29];
    const last = series[series.length - 1];
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily GMV and ad spend over the last 30 days">
      <defs><linearGradient id="g-gmv" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/>
      </linearGradient></defs>
      ${ticks.map((t) => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1" ${t ? 'stroke-dasharray="2 4"' : ""}/>
        <text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${money(t)}</text>`).join("")}
      ${xt.map((i) => `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === 29 ? "end" : "middle"}">${date(series[i].date)}</text>`).join("")}
      <path d="${area("gmv")}" fill="url(#g-gmv)" stroke="none"/>
      <path d="${line("gmv")}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="${line("spend")}" fill="none" stroke="var(--accent-2)" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="${x(29)}" cy="${y(last.gmv)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
      <circle cx="${x(29)}" cy="${y(last.spend)}" r="4" fill="var(--accent-2)" stroke="var(--surface)" stroke-width="2"/>
    </svg>`;
  }

  /* ---------- ads ---------- */
  function thumb(ad) {
    const len = ad.duration ? `0:${String(ad.duration).padStart(2, "0")}` : "Carousel";
    return `<div class="thumb" style="${thumbStyle(ad)}">
      <div class="thumb-top"><span class="pill p-${ad.status}">${AD_STATUS[ad.status]}</span><span class="tag">${len}</span></div>
      ${ad.duration ? '<span class="play" aria-hidden="true"></span>' : ""}
      <div class="thumb-hook">${esc(ad.hook)}</div>
    </div>`;
  }
  function adCards(b) {
    const list = b.ads
      .filter((a) => state.filter === "all" || a.status === state.filter)
      .sort((a, z) => z.launched.localeCompare(a.launched));
    if (!list.length) return `<div class="ads-empty">No ${AD_STATUS[state.filter].toLowerCase()} ads for ${esc(b.name)} right now.</div>`;
    return `<div class="ads">${list.map((a) => `
      <button class="ad" data-ad="${a.id}" aria-label="Open specs for ${esc(a.title)}">
        ${thumb(a)}
        <div class="ad-body">
          <div class="ad-title">${esc(a.title)}</div>
          <div class="ad-meta"><span>${esc(a.creator)}</span><span>${date(a.launched)}</span></div>
          <div class="ad-stats">
            <div><b>${a.spend ? money(a.spend) : "–"}</b><span>Spend</span></div>
            <div><b>${a.roas ? a.roas.toFixed(1) + "×" : "–"}</b><span>ROAS</span></div>
            <div><b>${a.ctr ? a.ctr.toFixed(1) + "%" : "–"}</b><span>CTR</span></div>
          </div>
        </div>
      </button>`).join("")}</div>`;
  }
  function chips(b) {
    const opts = ["all", "live", "paused", "review", "ended"];
    return `<div class="chips" role="group" aria-label="Filter ads by status">${opts.map((o) => {
      const n = o === "all" ? b.ads.length : b.ads.filter((a) => a.status === o).length;
      return `<button class="chip" data-filter="${o}" aria-pressed="${state.filter === o}">${o === "all" ? "All" : AD_STATUS[o]}<span class="num">${n}</span></button>`;
    }).join("")}</div>`;
  }

  /* ---------- brand room ---------- */
  function renderBrand() {
    const b = brands.find((x) => x.id === state.brandId) || brands[0];
    const k = b.kpis;
    const used = Math.min(100, Math.round((k.spend / b.monthlyBudget) * 100));
    const live = b.ads.filter((a) => a.status === "live").length;
    $("#main").innerHTML = `
      <section class="brand-head">
        <span class="mono" style="${monoStyle(b)}" aria-hidden="true">${esc(initials(b.name))}</span>
        <div class="brand-title">
          <h1>${esc(b.name)}</h1>
          <div class="brand-sub"><span>${esc(b.category)}</span><span>Account lead: ${esc(b.lead)}</span><span>${live} live ad${live === 1 ? "" : "s"}</span></div>
        </div>
        <span class="status st-${b.status}"><span class="sdot s-${b.status}"></span>${STATUS[b.status]} <small>· ${esc(b.statusNote)}</small></span>
      </section>

      <div class="goal"><span class="eyebrow">Current goal</span><span>${esc(b.goal)}</span></div>

      ${kpiTiles(k)}

      <div class="row">
        <section class="card">
          <div class="card-head">
            <h2>GMV and ad spend, last 30 days</h2>
            <div class="legend"><span><i style="background:var(--accent)"></i>GMV</span><span><i style="background:var(--accent-2)"></i>Ad spend</span></div>
          </div>
          <div class="chart">${chart(b.series)}</div>
        </section>
        <section class="card">
          <div class="card-head"><h2>Latest from Slack</h2><span class="channel">${esc(b.slack[0] ? b.slack[0].channel : "")}</span></div>
          <ul class="feed">${b.slack.map((m) => `
            <li class="msg">
              <span class="avatar" aria-hidden="true">${esc(initials(m.author.replace(/[()]/g, "")))}</span>
              <div><div class="msg-top"><b>${esc(m.author)}</b><time datetime="${m.time}">${time(m.time)}</time></div><p>${esc(m.text)}</p></div>
            </li>`).join("")}</ul>
        </section>
      </div>

      <section style="display:flex;flex-direction:column;gap:14px">
        <div class="ads-head"><h2>Recent ads</h2>${chips(b)}</div>
        <div id="ads">${adCards(b)}</div>
      </section>

      <div class="row">
        <section class="card">
          <div class="card-head"><h2>Top products</h2><span class="eyebrow">Share of 30-day GMV</span></div>
          <div class="products">${b.products.map((p) => `
            <div class="prod">
              <span class="prod-name">${esc(p.name)}</span><span class="prod-val num">${money(p.gmv)}</span>
              <div class="bar"><i style="width:${p.share}%"></i></div>
              <span class="prod-sub num">${p.units.toLocaleString("en-US")} units · ${p.share}%</span>
            </div>`).join("")}</div>
        </section>
        <section class="card">
          <div class="card-head"><h2>Account</h2></div>
          <dl class="facts">
            <dt>Client since</dt><dd>${new Date(b.retainerStart + "T00:00:00").toLocaleDateString("en-US", { month: "long", year: "numeric" })}</dd>
            <dt>Monthly ad budget</dt><dd class="num">${moneyFull(b.monthlyBudget)}</dd>
            <dt>Spent this period</dt><dd class="num">${moneyFull(k.spend)} · ${used}%</dd>
          </dl>
          <div class="meter" role="img" aria-label="${used}% of monthly budget spent"><i style="width:${used}%"></i></div>
        </section>
      </div>`;
    document.title = b.name + " · Brand Room";
  }

  /* ---------- ad drawer ---------- */
  let lastFocus = null;
  function openAd(id) {
    const b = brands.find((x) => x.id === state.brandId);
    const a = b && b.ads.find((x) => x.id === id);
    if (!a) return;
    lastFocus = document.activeElement;
    const pending = !a.impressions;
    const spec = (rows) => `<dl class="specs">${rows.map(([k, v, text]) => `<dt>${k}</dt><dd class="${text ? "text" : ""}">${v}</dd>`).join("")}</dl>`;
    const d = $("#drawer");
    d.innerHTML = `
      <div class="drawer-head">
        <div style="min-width:0;display:flex;flex-direction:column;gap:6px">
          <span class="eyebrow">${esc(b.name)} · ${a.id}</span>
          <h2 id="drawer-title">${esc(a.title)}</h2>
          <span style="color:var(--muted)">${esc(a.creator)} · launched ${date(a.launched)}</span>
        </div>
        <button class="close" id="close" aria-label="Close ad specs">×</button>
      </div>
      <div class="preview-wrap">
        <div class="preview">${thumb(a)}</div>
        <div class="headline-stats">
          <div class="hs"><b>${pending ? "–" : money(a.gmv)}</b><span>GMV</span></div>
          <div class="hs"><b>${pending ? "–" : a.roas.toFixed(1) + "×"}</b><span>ROAS</span></div>
          <div class="hs"><b>${pending ? "–" : money(a.spend)}</b><span>Spend</span></div>
          <div class="hs"><b>${pending ? "–" : count(a.impressions)}</b><span>Impressions</span></div>
        </div>
      </div>
      <div class="spec-group"><h3>Creative</h3>${spec([
        ["Format", esc(a.format)],
        ["Length", a.duration ? a.duration + " sec" : "Static carousel"],
        ["Aspect ratio", a.ratio],
        ["Resolution", esc(a.resolution)],
        ["Hook", esc(a.hook), true],
        ["Call to action", esc(a.cta), true],
      ])}</div>
      <div class="spec-group"><h3>Delivery</h3>${spec([
        ["Placement", esc(a.placement), true],
        ["Objective", esc(a.objective), true],
        ["Audience", esc(a.audience), true],
        ["Daily budget", moneyFull(a.budget)],
        ["Product", esc(a.product), true],
      ])}</div>
      <div class="spec-group"><h3>Performance to date</h3>${pending
        ? `<p class="foot-note" style="margin:0">This ad is still in review. Results appear once it starts delivering.</p>`
        : spec([
          ["Spend", moneyFull(a.spend)],
          ["Impressions", a.impressions.toLocaleString("en-US")],
          ["CTR", a.ctr.toFixed(1) + "%"],
          ["Conversion rate", a.cvr.toFixed(1) + "%"],
          ["ROAS", a.roas.toFixed(2) + "×"],
          ["GMV", moneyFull(a.gmv)],
        ])}</div>
      <div class="drawer-foot">
        <button class="btn primary" disabled title="Available once Euka is connected">Open in Euka</button>
        <button class="btn" disabled title="Available once Slack is connected">Share to ${esc(b.slack[0] ? b.slack[0].channel : "Slack")}</button>
      </div>
      <p class="foot-note" style="margin:0">Buttons go live once the real Euka and Slack data is connected.</p>`;
    d.hidden = false;
    $("#scrim").hidden = false;
    $("#close").focus();
  }
  function closeAd() {
    if ($("#drawer").hidden) return;
    $("#drawer").hidden = true;
    $("#scrim").hidden = true;
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }

  /* ---------- routing + events ---------- */
  function select(id) {
    if (!brands.some((b) => b.id === id)) id = brands[0].id;
    if (state.brandId !== id) state.filter = "all";
    state.brandId = id;
    closeAd();
    renderRail();
    renderBrand();
  }
  function fromHash() { select(decodeURIComponent(location.hash.slice(1))); }

  $("#brand-list").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-brand]");
    if (!btn) return;
    const id = btn.dataset.brand;
    if (location.hash.slice(1) === id) select(id); else location.hash = id;
    window.scrollTo({ top: 0 });
  });
  $("#brand-search").addEventListener("input", (e) => { state.query = e.target.value; renderRail(); });
  $("#main").addEventListener("click", (e) => {
    const chip = e.target.closest("[data-filter]");
    if (chip) {
      state.filter = chip.dataset.filter;
      const b = brands.find((x) => x.id === state.brandId);
      document.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", c.dataset.filter === state.filter));
      $("#ads").innerHTML = adCards(b);
      return;
    }
    const ad = e.target.closest("[data-ad]");
    if (ad) openAd(ad.dataset.ad);
  });
  $("#drawer").addEventListener("click", (e) => { if (e.target.closest("#close")) closeAd(); });
  $("#scrim").addEventListener("click", closeAd);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeAd(); });
  window.addEventListener("hashchange", fromHash);

  fromHash();
})();
</script>
<!--BODY-END-->
</body>
</html>
