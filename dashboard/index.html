<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--PAGE-START-->
<title>Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left navigation, one scrolling workspace, floating AI assistant bottom-right. Single black-and-purple look. */
:root {
  color-scheme: dark;
  --bg: #07060b;
  --panel: #0f0d16;
  --panel-2: #16131f;
  --panel-3: #1d1929;
  --line: #262036;
  --line-2: #352c4c;
  --ink: #f2effa;
  --muted: #a59dbd;
  --faint: #6e6687;
  --purple: #8b5cf6;
  --purple-hi: #b69cff;
  --purple-lo: #4c2a9a;
  --purple-soft: rgba(139, 92, 246, .14);
  --magenta: #f472b6;
  --good: #3ddc97;  --good-soft: rgba(61, 220, 151, .12);
  --warn: #f5b14c;  --warn-soft: rgba(245, 177, 76, .13);
  --bad: #ff6b7a;   --bad-soft: rgba(255, 107, 122, .13);
  --glow: 0 0 0 1px rgba(139, 92, 246, .35), 0 10px 40px rgba(139, 92, 246, .18);

  --font-display: "Syne", "Segoe UI", system-ui, sans-serif;
  --font-body: "DM Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --nav: 236px;
  --r: 14px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 14px/1.5 var(--font-body); -webkit-font-smoothing: antialiased;
  background-image: radial-gradient(900px 420px at 70% -120px, rgba(139, 92, 246, .16), transparent 70%);
  background-repeat: no-repeat;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--purple-hi); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font: 700 clamp(24px, 2.6vw, 32px)/1.1 var(--font-display); letter-spacing: -.01em; }
h2 { font: 700 18px/1.2 var(--font-display); }
h3 { font: 600 15px/1.3 var(--font-body); }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.muted { color: var(--muted); }
a { color: var(--purple-hi); }

/* ---------- navigation ---------- */
.nav {
  position: fixed; top: 0; left: 0; bottom: 0; width: var(--nav); z-index: 20;
  background: var(--panel); border-right: 1px solid var(--line);
  padding-top: calc(env(safe-area-inset-top, 0px) + 20px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px;
  display: flex; flex-direction: column; gap: 22px;
}
.logo { display: flex; align-items: center; gap: 10px; padding-inline: 8px; }
.logo-mark {
  width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center;
  background: linear-gradient(140deg, var(--purple-hi), var(--purple-lo)); box-shadow: 0 6px 20px rgba(139,92,246,.35);
}
.logo-mark svg { width: 18px; height: 18px; }
.logo-name { font: 800 20px/1 var(--font-display); letter-spacing: -.01em; }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-label { padding: 0 10px 6px; }
.nav a {
  display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 10px;
  color: var(--muted); text-decoration: none; font-weight: 500;
}
.nav a svg { width: 18px; height: 18px; flex: none; }
.nav a:hover { color: var(--ink); background: var(--panel-2); }
.nav a[aria-current="page"] { color: var(--ink); background: var(--purple-soft); box-shadow: inset 0 0 0 1px rgba(139,92,246,.35); }
.nav a[aria-current="page"] svg { color: var(--purple-hi); }
.nav .count { margin-left: auto; font: 500 11px var(--font-mono); padding: 2px 7px; border-radius: 99px; background: var(--purple); color: #fff; }
.nav-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
.viewer {
  border: 1px solid var(--line); background: var(--panel-2); border-radius: 12px; padding: 10px 12px;
  display: flex; flex-direction: column; gap: 6px;
}
.viewer select {
  width: 100%; background: var(--panel-3); border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 8px;
}
.viewer small { color: var(--faint); font-size: 11.5px; line-height: 1.4; }

/* ---------- workspace ---------- */
.work {
  margin-left: var(--nav); min-width: 0;
  padding-top: calc(env(safe-area-inset-top, 0px) + 20px); padding-bottom: 110px;
  padding-left: 32px; padding-right: max(32px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 24px;
}
.topline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.source {
  display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 99px;
  border: 1px solid var(--line); background: var(--panel); font-size: 12px; color: var(--muted);
}
.source b { color: var(--ink); font-weight: 600; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); flex: none; }
.dot.off { background: var(--faint); box-shadow: none; }
.sample { font: 500 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .06em; padding: 7px 10px; border-radius: 7px; background: var(--warn-soft); color: var(--warn); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.page-head p { margin: 0; color: var(--muted); max-width: 62ch; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); gap: 18px; align-items: start; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; white-space: nowrap;
  border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 10px; padding: 9px 14px; font-weight: 600; text-decoration: none; color: var(--ink);
}
.btn:hover { border-color: var(--purple); }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: linear-gradient(140deg, #9a6bff, #6d3ee0); border-color: transparent; color: #fff; box-shadow: 0 6px 20px rgba(139,92,246,.3); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); border-color: var(--line-2); }
.btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 6px 12px; font-size: 13px; cursor: pointer; color: var(--muted); }
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--purple-soft); color: var(--ink); border-color: var(--purple); }
.chip .num { opacity: .65; margin-left: 4px; }
.select { background: var(--panel); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; font-size: 13px; color: var(--ink); }

.pill { display: inline-flex; align-items: center; gap: 6px; font: 600 11.5px/1 var(--font-body); padding: 5px 9px; border-radius: 99px; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.purple { background: var(--purple-soft); color: var(--purple-hi); }
.pill.plain { background: var(--panel-3); color: var(--muted); }
.sdot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.s-on-track { background: var(--good); } .s-attention { background: var(--warn); } .s-at-risk { background: var(--bad); }

.mono { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font: 700 14px/1 var(--font-display); color: #fff; flex: none; }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 15px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.kpi.hero { background: linear-gradient(160deg, rgba(139,92,246,.22), rgba(139,92,246,.04) 70%), var(--panel); border-color: rgba(139,92,246,.45); }
.kpi-val { font: 700 26px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.delta { font-size: 12px; font-weight: 600; display: inline-flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.delta.up { color: var(--good); } .delta.down { color: var(--bad); } .delta.flat { color: var(--muted); }
.delta span { color: var(--faint); font-weight: 400; }
.locked { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 14px 16px; border: 1px dashed var(--line-2); border-radius: var(--r); }
.locked svg { width: 18px; height: 18px; color: var(--faint); flex: none; }

/* charts */
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--faint); font: 400 11px var(--font-mono); }
.share { display: flex; height: 12px; border-radius: 99px; overflow: hidden; gap: 2px; }
.share i { display: block; height: 100%; }
.share-legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px 16px; }
.share-legend div { display: flex; align-items: center; gap: 8px; font-size: 13px; min-width: 0; }
.share-legend span:nth-child(2) { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.share-legend i { width: 9px; height: 9px; border-radius: 3px; flex: none; }

/* brand results on home */
.brand-results { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.br { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.br-head { display: flex; gap: 12px; align-items: center; }
.br-head > div { min-width: 0; flex: 1; }
.br-name { font-weight: 600; font-size: 15px; }
.br-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.br-stats div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.br-stats b { font: 600 15px var(--font-body); font-variant-numeric: tabular-nums; }
.br-stats span { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; }
.br-news { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; display: flex; gap: 8px; align-items: baseline; }
.br-news b { color: var(--ink); font-weight: 500; }
.spark svg { width: 100%; height: 44px; display: block; }

/* news */
.feed { display: flex; flex-direction: column; gap: 14px; }
.day { display: flex; align-items: center; gap: 12px; color: var(--faint); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.day::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.post { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 12px; }
.bot { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: linear-gradient(140deg, var(--purple-hi), var(--purple-lo)); }
.bot svg { width: 18px; height: 18px; }
.post-body { background: var(--panel); border: 1px solid var(--line); border-radius: 4px 14px 14px 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.post-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.post-top time { color: var(--faint); font-size: 12px; }
.post-title { font-weight: 600; font-size: 15px; }
.post p { margin: 0; color: var(--muted); }
.eval { border-radius: 10px; padding: 11px 13px; background: var(--panel-2); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.eval-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.eval p { color: var(--ink); }
.metrics { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--faint); }
.metrics b { color: var(--ink); font: 600 14px var(--font-mono); margin-right: 5px; }
.post-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.post-actions .src { margin-left: auto; font: 500 12px var(--font-mono); color: var(--faint); }
.side-list { display: flex; flex-direction: column; gap: 10px; }
.side-list div { display: flex; justify-content: space-between; gap: 10px; align-items: center; }

/* brands */
.brand-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.brand-tile {
  text-align: left; cursor: pointer; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px;
  display: flex; flex-direction: column; gap: 16px; transition: border-color .15s, box-shadow .15s, transform .15s; text-decoration: none; color: inherit;
}
.brand-tile:hover { border-color: var(--purple); box-shadow: var(--glow); transform: translateY(-2px); }
.brand-tile .row { display: flex; gap: 12px; align-items: center; }
.brand-tile .row > div { min-width: 0; }
.brand-tile .stats { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; font-size: 13px; color: var(--muted); }
.brand-tile .stats b { color: var(--ink); font-weight: 600; }
.add-tile { border-style: dashed; align-items: center; justify-content: center; color: var(--muted); min-height: 150px; }
.add-tile svg { width: 26px; height: 26px; color: var(--purple-hi); }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-size: 13px; }
.back:hover { color: var(--ink); }
.brand-head { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.brand-head .mono { width: 58px; height: 58px; border-radius: 16px; font-size: 22px; }
.brand-head > div { flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.brand-sub { display: flex; gap: 6px 14px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
.brand-head > .brand-actions { flex: 0 1 auto; display: flex; gap: 8px; flex-wrap: wrap; }

.videos { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
.video { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); overflow: hidden; padding: 0; text-align: left; cursor: pointer; display: flex; flex-direction: column; transition: transform .15s, box-shadow .15s, border-color .15s; }
.video:hover { transform: translateY(-2px); border-color: var(--purple); box-shadow: var(--glow); }
.thumb { position: relative; aspect-ratio: 9 / 14; max-width: 100%; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; color: #fff; }
.thumb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.7), rgba(0,0,0,0) 55%); }
.thumb > * { position: relative; z-index: 1; }
.thumb-hook { font: 600 14px/1.3 var(--font-body); text-wrap: balance; }
.thumb-top { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; gap: 6px; z-index: 1; }
.tag { font: 500 11px/1 var(--font-mono); padding: 5px 7px; border-radius: 6px; background: rgba(0,0,0,.5); color: #fff; }
.play { position: absolute; top: 46%; left: 50%; translate: -50% -50%; z-index: 1; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.2); backdrop-filter: blur(6px); display: grid; place-items: center; }
.play::before { content: ""; border-left: 13px solid #fff; border-top: 8px solid transparent; border-bottom: 8px solid transparent; margin-left: 4px; }
.v-live { background: var(--good); color: #04140c; } .v-paused { background: var(--warn); color: #1b1203; } .v-ended { background: #3a3450; color: #ddd6f3; } .v-review { background: var(--purple); color: #fff; }
.video-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.video-title { font-weight: 600; line-height: 1.3; }
.video-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.video-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; margin-top: auto; }
.video-stats div { display: flex; flex-direction: column; gap: 1px; }
.video-stats b { font-weight: 600; font-variant-numeric: tabular-nums; }
.video-stats span { font-size: 10.5px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; }
.empty { color: var(--muted); padding: 28px; text-align: center; border: 1px dashed var(--line-2); border-radius: var(--r); }

.requests { display: flex; flex-direction: column; gap: 10px; }
.req { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); cursor: pointer; text-align: left; }
.req:hover { border-color: var(--purple); }
.req-steps { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.req-steps i { height: 4px; border-radius: 3px; background: var(--line-2); overflow: hidden; position: relative; }
.req-steps i span { position: absolute; inset: 0 auto 0 0; background: var(--purple); }

/* people + connections */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
table { width: 100%; border-collapse: collapse; min-width: 760px; }
th, td { text-align: left; padding: 13px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); background: var(--panel-2); }
tr:last-child td { border-bottom: 0; }
.person { display: flex; gap: 10px; align-items: center; }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--panel-3); border: 1px solid var(--line-2); font: 600 12px var(--font-body); color: var(--purple-hi); flex: none; }
.perm-list { display: flex; gap: 5px; flex-wrap: wrap; }
.row-actions { display: flex; gap: 6px; justify-content: flex-end; }
.conn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.conn { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.conn-top { display: flex; align-items: center; gap: 10px; }
.conn-logo { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--panel-3); font: 700 14px var(--font-display); color: var(--purple-hi); border: 1px solid var(--line-2); }
.conn p { margin: 0; color: var(--muted); font-size: 13px; }

/* ---------- overlays ---------- */
.scrim { position: fixed; inset: 0; background: rgba(4, 3, 8, .7); backdrop-filter: blur(3px); z-index: 60; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 70; width: min(520px, 100%); background: var(--panel); border-left: 1px solid var(--line-2);
  overflow-y: auto; padding-top: calc(env(safe-area-inset-top, 0px) + 20px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  padding-left: 24px; padding-right: max(24px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px;
}
.modal-wrap { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.modal { width: min(560px, 100%); background: var(--panel); border: 1px solid var(--line-2); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.modal.wide { width: min(980px, 100%); }
.modal-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.modal-head > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.modal-head p { margin: 0; color: var(--muted); }
.x { border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 9px; width: 34px; height: 34px; cursor: pointer; font-size: 18px; line-height: 1; flex: none; }
.span { grid-column: 1 / -1; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.steps-ind { display: flex; gap: 8px; font-size: 12px; color: var(--faint); }
.steps-ind b { color: var(--purple-hi); }

.form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

}
.field textarea { min-height: 92px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--purple); box-shadow: 0 0 0 3px var(--purple-soft); }

/* ad specs */
.preview-wrap { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 18px; align-items: start; }
.preview { aspect-ratio: 9 / 16; max-width: 100%; border-radius: 14px; overflow: hidden; }

.hs { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }

.hs span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.spec-group { display: flex; flex-direction: column; gap: 8px; }

.specs dt, .specs dd { padding: 9px 0; border-bottom: 1px solid var(--line); margin: 0; }

.specs dd { font: 13px var(--font-mono); overflow-wrap: anywhere; }

/* agent pipeline */
.studio { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 20px; align-items: start; }

.agent-ic { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: var(--panel-3); color: var(--purple-hi); border: 1px solid var(--line-2); }

.fab {
